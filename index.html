<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopee Ads</title>
    <style>
      /* Splash shown before the JS bundle runs; removed by src/main.tsx after first paint. */
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        background: #f3f4f7; color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        transition: opacity 420ms ease, transform 420ms ease;
      }
      html.dark #splash { background: #0f111a; color: #f5f6f8; }
      #splash.splash--out { opacity: 0; transform: scale(1.02); pointer-events: none; }
      .splash-mark {
        position: relative; width: 64px; height: 64px; border-radius: 22px;
        background: #ee4d2d; color: #fff; display: grid; place-items: center;
        font-weight: 700; font-size: 28px; letter-spacing: -0.02em;
        box-shadow: 0 16px 40px -16px rgba(238, 77, 45, 0.6);
        animation: splash-float 1.8s ease-in-out infinite;
      }
      .splash-mark::after {
        content: ""; position: absolute; inset: -10px; border-radius: 30px;
        border: 2px solid rgba(238, 77, 45, 0.35);
        animation: splash-ring 1.8s ease-out infinite;
      }
      .splash-name { font-size: 15px; font-weight: 600; opacity: 0.9; }
      .splash-bar { width: 120px; height: 4px; border-radius: 999px; background: rgba(238, 77, 45, 0.15); overflow: hidden; }
      .splash-bar::before {
        content: ""; display: block; width: 40%; height: 100%; border-radius: 999px; background: #ee4d2d;
        animation: splash-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes splash-ring { 0% { transform: scale(0.85); opacity: 0.9; } 100% { transform: scale(1.25); opacity: 0; } }
      @keyframes splash-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(280%); } }
      @media (prefers-reduced-motion: reduce) { .splash-mark, .splash-mark::after, .splash-bar::before { animation: none; } }
    </style>
    <script>
      // Match the stored theme before paint so the splash never flashes the wrong color.
      try { if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark"); } catch {}
    </script>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Memuat Shopee Ads">
      <div class="splash-mark">S</div>
      <div class="splash-name">Shopee Ads</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
